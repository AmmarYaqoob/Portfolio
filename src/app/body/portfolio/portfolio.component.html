<div style="outline:none" tabindex="-1" id="gatsby-focus-wrapper">
  <section class="portfolio new portfolio-page">
    <div class="container">
      <div class="breadcrumbs"><a href="/" class="breadcrumbs-link"><svg class="breadcrumbs-homeIcon"
            xmlns="http://www.w3.org/2000/svg" width="12" height="14" viewBox="0 0 12 14" fill="none">
            <path
              d="M11.3334 4.33334L7.3334 0.826671C6.96671 0.498701 6.49202 0.317383 6.00006 0.317383C5.50811 0.317383 5.03341 0.498701 4.66673 0.826671L0.66673 4.33334C0.454975 4.52272 0.285997 4.75504 0.171044 5.01483C0.0560923 5.27463 -0.00219504 5.55593 6.31961e-05 5.84V11.6667C6.31961e-05 12.1971 0.210777 12.7058 0.58585 13.0809C0.960922 13.456 1.46963 13.6667 2.00006 13.6667H10.0001C10.5305 13.6667 11.0392 13.456 11.4143 13.0809C11.7893 12.7058 12.0001 12.1971 12.0001 11.6667V5.83334C12.0014 5.55038 11.9426 5.27036 11.8277 5.01179C11.7128 4.75322 11.5443 4.52198 11.3334 4.33334ZM7.3334 12.3333H4.66673V9C4.66673 8.82319 4.73697 8.65362 4.86199 8.5286C4.98702 8.40358 5.15658 8.33334 5.3334 8.33334H6.66673C6.84354 8.33334 7.01311 8.40358 7.13813 8.5286C7.26316 8.65362 7.3334 8.82319 7.3334 9V12.3333ZM10.6667 11.6667C10.6667 11.8435 10.5965 12.0131 10.4715 12.1381C10.3464 12.2631 10.1769 12.3333 10.0001 12.3333H8.66673V9C8.66673 8.46957 8.45602 7.96086 8.08094 7.58579C7.70587 7.21072 7.19716 7 6.66673 7H5.3334C4.80296 7 4.29426 7.21072 3.91918 7.58579C3.54411 7.96086 3.3334 8.46957 3.3334 9V12.3333H2.00006C1.82325 12.3333 1.65368 12.2631 1.52866 12.1381C1.40363 12.0131 1.3334 11.8435 1.3334 11.6667V5.83334C1.33352 5.73868 1.35379 5.64514 1.39287 5.55892C1.43196 5.47271 1.48895 5.39581 1.56006 5.33334L5.56006 1.83334C5.68172 1.72646 5.83812 1.66751 6.00006 1.66751C6.162 1.66751 6.3184 1.72646 6.44006 1.83334L10.4401 5.33334C10.5112 5.39581 10.5682 5.47271 10.6073 5.55892C10.6463 5.64514 10.6666 5.73868 10.6667 5.83334V11.6667Z"
              fill="#98A4B3"></path>
          </svg>
        </a>
        <a href="/portfolio" class="breadcrumbs-link breadcrumbs-link_dark">Portfolio</a>
      </div>

      <h1 class="h1" appScrollReveal>Learn more by checking out my portfolio</h1>

      <div class="portfolio-filters" role="tablist" aria-label="Filter portfolio projects" appScrollReveal [revealDelay]="80">
        <button type="button" class="portfolio-filter" *ngFor="let filter of filters"
          [class.portfolio-filter--active]="activeFilter === filter.id" (click)="setFilter(filter.id)"
          [attr.aria-pressed]="activeFilter === filter.id">
          {{ filter.label }}
        </button>
      </div>

      <p class="portfolio-results" *ngIf="filteredProjects.length === 0">
        No projects match this filter yet.
      </p>

      <div class="cases-list" appScrollRevealGroup revealChildSelector=".cases-item" [revealKey]="activeFilter">
        <div class="cases-item portfolio-card" *ngFor="let project of filteredProjects">
          <div class="cases-item-img portfolio-card__media">
            <img [ngSrc]="project.data.image" width="393" height="200" [alt]="project.data.title">
          </div>
          <div class="cases-item-content">
            <div class="portfolio-card__tags" *ngIf="project.data.categories?.length">
              <span class="portfolio-tag" *ngFor="let category of project.data.categories">
                {{ categoryLabel(category) }}
              </span>
            </div>
            <h2 class="cases-item__title h2">{{ project.data.title }}</h2>
            <h3 class="cases-item__caption h4">{{ project.data.description }}</h3>
            <div class="portfolio-card__actions">
              <div class="portfolio-card__links">
                <a href="{{ project.data.links.live }}" *ngIf="project.data.links.live" target="_blank"
                  rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 fs-14 p-r-10">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-external-link h-4 w-4 mr-1" aria-hidden="true">
                    <path d="M15 3h6v6"></path>
                    <path d="M10 14 21 3"></path>
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                  </svg>
                  Live
                </a>
                <a href="{{ project.data.links.github }}" *ngIf="project.data.links.github" target="_blank"
                  rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 fs-14">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-github h-4 w-4 mr-1" aria-hidden="true">
                    <path
                      d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4">
                    </path>
                    <path d="M9 18c-4.51 2-5-2-7-2"></path>
                  </svg>Code
                </a>
              </div>
              <a class="inline-flex items-center justify-center gap-2 button button_secondary" data-discover="true"
                routerLink="/portfolio/{{ project.slug }}">
                View Details
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-arrow-up-right h-3 w-3 ml-1" aria-hidden="true">
                  <path d="M7 7h10v10"></path>
                  <path d="M7 17 17 7"></path>
                </svg>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
